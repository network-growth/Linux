---
- name: Nginx 설치
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 사이트 폴더
  ansible.builtin.file:
    path: "{{ nginx_site_root }}"
    state: directory
    owner: "{{ nginx_site_owner }}"
    group: "{{ nginx_site_owner }}"
    mode: "0755"

- name: 페이지
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_site_root }}/index.html"
    owner: "{{ nginx_site_owner }}"
    group: "{{ nginx_site_owner }}"
    mode: "0644"

- name: Nginx 사이트 설정
  ansible.builtin.copy:
    src: lab
    dest: /etc/nginx/sites-available/lab
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: 기본 사이트 끄기
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: 내 사이트 켜기
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab
    dest: /etc/nginx/sites-enabled/lab
    state: link
  notify: Reload nginx

- name: Nginx 실행 + 부팅 시 자동 시작
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
