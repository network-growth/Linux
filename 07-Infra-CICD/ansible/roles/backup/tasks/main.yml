---
- name: 백업 스크립트
  ansible.builtin.copy:
    src: lab-backup.sh
    dest: /usr/local/sbin/lab-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: 백업 service / timer 유닛
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - lab-backup.service
    - lab-backup.timer

- name: 백업 타이머 켜기
  ansible.builtin.systemd_service:
    name: lab-backup.timer
    state: started
    enabled: true
    daemon_reload: true
